name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CMR_ADMIN_CS: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore and build
        run: dotnet build Cmr.slnx -c Release
      - name: Unit and API tests
        run: dotnet test tests/Cmr.Tests/Cmr.Tests.csproj -c Release --no-build
      - name: Vulnerable packages
        run: |
          set -e
          dotnet list Cmr.slnx package --vulnerable --include-transitive > vuln.txt
          if grep -E "High|Critical" vuln.txt; then
            cat vuln.txt
            exit 1
          fi
          cat vuln.txt
      - name: Playwright browsers
        run: |
          dotnet build tests/Cmr.E2E/Cmr.E2E.csproj -c Release
          node=$(find tests/Cmr.E2E/bin/Release/net10.0/.playwright/node -type f -name node | head -1)
          "$node" tests/Cmr.E2E/bin/Release/net10.0/.playwright/package/cli.js install --with-deps chromium
      - name: End-to-end tests
        env:
          CMR_E2E_CONFIG: Release
        run: dotnet test tests/Cmr.E2E/Cmr.E2E.csproj -c Release --no-build
