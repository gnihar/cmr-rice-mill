name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CMR_ADMIN_CS: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore and build
        run: dotnet build Cmr.slnx -c Release
      - name: Unit and API tests
        run: dotnet test tests/Cmr.Tests/Cmr.Tests.csproj -c Release --no-build
      - name: Vulnerable packages
        run: |
          set -e
          dotnet list Cmr.slnx package --vulnerable --include-transitive > vuln.txt
          if grep -E "High|Critical" vuln.txt; then
            cat vuln.txt
            exit 1
          fi
          cat vuln.txt
      - name: Playwright browsers
        run: |
          dotnet build tests/Cmr.E2E/Cmr.E2E.csproj -c Release
          node=$(find tests/Cmr.E2E/bin/Release/net10.0/.playwright/node -type f -name node | head -1)
          "$node" tests/Cmr.E2E/bin/Release/net10.0/.playwright/package/cli.js install --with-deps chromium
      - name: End-to-end tests
        env:
          CMR_E2E_CONFIG: Release
        run: dotnet test tests/Cmr.E2E/Cmr.E2E.csproj -c Release --no-build --filter "FullyQualifiedName!~PublishedImageSmoke"
      - name: Production image smoke
        run: |
          set -euo pipefail
          docker build -t cmr:smoke .
          docker rm -f cmr-smoke >/dev/null 2>&1 || true
          docker run -d --name cmr-smoke -p 8080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e PORT=8080 \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e SEED_DEMO=true \
            -e DATABASE_URL="postgresql://postgres:postgres@host.docker.internal:5432/postgres?sslmode=disable" \
            -e CMR_APP_PASSWORD=cmr_app_dev \
            -e "JWT_KEY=smoke-test-jwt-key-0123456789abcdef" \
            cmr:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            if ! docker ps --filter name=cmr-smoke --filter status=running -q | grep -q .; then
              docker logs cmr-smoke
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health
          html=$(curl -fsS http://127.0.0.1:8080/)
          printf '%s' "$html" | grep -q 'blazor.webassembly.'
          if printf '%s' "$html" | grep -F -q '#[.{fingerprint}]'; then
            echo "published index.html still has the fingerprint placeholder"
            printf '%s\n' "$html"
            exit 1
          fi
          CMR_PUBLISHED_URL=http://127.0.0.1:8080 dotnet test tests/Cmr.E2E/Cmr.E2E.csproj -c Release --no-build --filter PublishedImageSmoke
          docker logs cmr-smoke | tail -40
          docker rm -f cmr-smoke
