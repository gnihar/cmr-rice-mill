services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cmr
    volumes:
      - pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-roles.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cmr"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      SEED_DEMO: "true"
      ConnectionStrings__Owner: Host=db;Port=5432;Database=cmr;Username=cmr_owner;Password=cmr_owner_dev
      ConnectionStrings__App: Host=db;Port=5432;Database=cmr;Username=cmr_app;Password=cmr_app_dev
      Storage__Root: /data/files
    ports:
      - "8080:8080"
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg:
  files:
